<div class="container py-4">
  <h1 class="text-center mb-4 title-glow">Execution History</h1>

  <ng-container *ngIf="history$ | async as history; else loading">
    <div *ngIf="history.length > 0; else noHistory" class="d-flex flex-column gap-3">
      <div *ngFor="let item of history" class="history-card p-3">
        <div class="card-body p-0">
          <h4 class="algo-title mb-3">
            {{ item.algorithm }}
          </h4>

          <div class="mb-3">
            <span class="section-label">Input</span>
            <pre class="json-block mb-0">{{ item.inputs | json }}</pre>
          </div>

          <div class="mb-2">
            <span class="section-label">Output</span>
            <div class="result-box">{{ item.result }}</div>
          </div>

          <p class="timestamp mb-0">
            {{ item.timestamp }}
          </p>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Loading state -->
  <ng-template #loading>
    <div class="text-center loading-text">
      Loading history...
    </div>
  </ng-template>

  <!-- Empty state -->
  <ng-template #noHistory>
    <div class="text-center empty-state">
      No history records found.
    </div>
  </ng-template>
</div>
