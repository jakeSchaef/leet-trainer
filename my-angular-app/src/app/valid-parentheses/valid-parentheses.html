<div class="page-container">
  <div class="algorithm-card">
    <h1 class="page-title">Valid Parentheses</h1>

    <p class="text-center text-secondary mb-4">
      Check whether the input string has valid matching parentheses.
    </p>

    <div class="mb-3 text-center">
      <label class="form-label d-block">String</label>
      <input
        class="form-control"
        type="text"
        placeholder="Example: ()[]{}"
        [(ngModel)]="input"
      >
    </div>

    <button
      class="btn btn-primary run-button"
      type="button"
      (click)="runValidParentheses(input)"
    >
      Run Algorithm
    </button>

    <div *ngIf="result" class="result-container mt-4">
      <h5>Result</h5>
      <p class="mb-0">{{ result }}</p>
    </div>
  </div>
</div>
