<div class="page-container">
  <div class="algorithm-card p-4">
    <h1 class="text-center mb-4 title-glow">Execution History</h1>

    <ng-container *ngIf="history$ | async as history; else loading">
      <div *ngIf="history.length; else noHistory" class="row g-3">
        <div *ngFor="let item of history" class="col-12">
          <div class="card history-card p-3">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h3 class="algo-title m-0">
                {{ item.algorithm }}
              </h3>
              <span class="timestamp">
                {{ item.timestamp }}
              </span>
            </div>

            <hr class="divider" />

            <!-- Inputs -->
            <div class="inputs-section mb-2">
              <strong class="section-label">Inputs</strong>
              <pre class="json-block">{{ item.inputs | json }}</pre>
            </div>

            <!-- Output -->
            <div class="output-section">
              <strong class="section-label">Output</strong>
              <div class="result-box">
                {{ item.result }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Loading -->
    <ng-template #loading>
      <div class="text-center loading-text">
        Loading history...
      </div>
    </ng-template>

    <!-- Empty State -->
    <ng-template #noHistory>
      <div class="text-center empty-state">
        No history records found.
      </div>
    </ng-template>
  </div>
</div>
